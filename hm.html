<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exalted · Heightmap terrain</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101a22; color: #e4edf4; font: 14px system-ui, sans-serif; }
    #view { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
    aside { position: fixed; z-index: 2; top: 0; left: 0; width: 285px; padding: 15px 18px 18px; background: #0b1720e8; border: 1px solid #395262; border-width: 0 1px 1px 0; border-radius: 0 0 8px 0; backdrop-filter: blur(10px); }
    a { color: #9bcce5; } h1 { margin: 12px 0 8px; font-size: 19px; } p { margin: 9px 0; line-height: 1.45; color: #b8c7d1; }
    label { display: block; margin-top: 10px; } input { vertical-align: middle; } button { margin-top: 10px; padding: 7px 11px; cursor: pointer; }
    #status { color: #b8d7bd; }
    dl { display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; margin: 13px 0; padding-top: 12px; border-top: 1px solid #30414b; font-size: 12px; }
    dt { color: #8298a7; } dd { margin: 0; }
  </style>
</head>
<body>
  <canvas id="view" tabindex="0" aria-label="Heightmap terrain comparison"></canvas>
  <aside>
    <a href="./">← Exalted</a>
    <h1>Heightmap terrain</h1>
    <p id="status" role="status">Loading 4096² heightmap…</p>
    <p>Drag to orbit, wheel to zoom, right-drag to pan.</p>
    <label><input id="wireframe" type="checkbox"> Show wireframe</label>
    <label><input id="biome-map" type="checkbox" checked> Show 4K biome map</label>
    <button id="reset" type="button">Reset camera</button>
    <dl>
      <dt>Ground size</dt><dd>936 × 702 m</dd>
      <dt>Subdivisions</dt><dd>400 × 400</dd>
      <dt>Triangles</dt><dd>320,000</dd>
      <dt>Height range</dt><dd>−3.9–249.4 m</dd>
    </dl>
    <p>This is an isolated visual comparison. The main app still uses <code>alpha-map.glb</code>.</p>
  </aside>
  <script type="module" src="/src/hm.ts"></script>
</body>
</html>
