<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exalted · Heightmap terrain</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101a22; color: #e4edf4; font: 14px system-ui, sans-serif; }
    #view { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
    aside { position: fixed; z-index: 2; top: 0; left: 0; width: 285px; padding: 15px 18px 18px; background: #0b1720e8; border: 1px solid #395262; border-width: 0 1px 1px 0; border-radius: 0 0 8px 0; backdrop-filter: blur(10px); }
    a { color: #9bcce5; } h1 { margin: 12px 0 8px; font-size: 19px; } p { margin: 9px 0; line-height: 1.45; color: #b8c7d1; }
    label { display: block; margin-top: 10px; } input { vertical-align: middle; } button { margin-top: 10px; padding: 7px 11px; cursor: pointer; }
    .upload { display: block; width: 100%; text-align: left; }
    .filename { display: block; margin-top: 4px; color: #8298a7; font-size: 12px; overflow-wrap: anywhere; }
    .opacity-label { display: flex; justify-content: space-between; gap: 10px; }
    input[type="range"] { display: block; width: 100%; margin: 7px 0 12px; accent-color: #9bcce5; }
    #status { color: #b8d7bd; }
  </style>
</head>
<body>
  <canvas id="view" tabindex="0" aria-label="Heightmap terrain comparison"></canvas>
  <aside>
    <a href="./">← Exalted</a>
    <h1>Heightmap terrain</h1>
    <p id="status" role="status">Loading maps…</p>
    <button id="upload-heightmap" class="upload" type="button" disabled>Upload heightmap</button>
    <input id="heightmap-file" type="file" accept="image/png,image/jpeg,image/webp" hidden aria-label="Choose heightmap">
    <span id="heightmap-name" class="filename">vis_ground_heightmap-11.png</span>
    <label for="heightmap-opacity" class="opacity-label">Heightmap opacity <output id="heightmap-opacity-value" for="heightmap-opacity">0%</output></label>
    <input id="heightmap-opacity" type="range" min="0" max="100" step="1" value="0" disabled>
    <button id="upload-biome" class="upload" type="button" disabled>Upload vertex map</button>
    <input id="biome-file" type="file" accept="image/png,image/jpeg,image/webp" hidden aria-label="Choose biome map">
    <span id="biome-name" class="filename">vertex_color_4k-9.png</span>
    <label for="biome-opacity" class="opacity-label">Vertex map opacity <output id="biome-opacity-value" for="biome-opacity">100%</output></label>
    <input id="biome-opacity" type="range" min="0" max="100" step="1" value="100" disabled>
    <p>Drag to orbit, wheel to zoom, right-drag to pan.</p>
    <label><input id="wireframe" type="checkbox"> Show wireframe</label>
    <button id="reset" type="button">Reset camera</button>
  </aside>
  <script type="module" src="/src/hm.ts"></script>
</body>
</html>
